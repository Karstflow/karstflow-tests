services:
  validator:
    image: karstflow:latest
    container_name: karstflow-dev
    ports:
      - "8899:8899"   # JSON-RPC
      - "8900:8900"   # WebSocket
      - "8001:8001"   # Gossip
      - "8000:8000"   # TPU
    command: ["--config", "/etc/karstflow/config.toml", "--dev"]
    environment:
      RUST_LOG: "info"
      RUST_BACKTRACE: "1"
    volumes:
      - validator-ledger:/var/lib/karstflow/ledger
      - validator-accounts:/var/lib/karstflow/accounts
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8899", "-d", '{"jsonrpc":"2.0","id":1,"method":"getHealth"}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - karstflow

volumes:
  validator-ledger:
  validator-accounts:

networks:
  karstflow:
    driver: bridge
