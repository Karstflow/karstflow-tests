services:
  validator-1:
    image: karstflow:latest
    ports:
      - "8899:8899"
      - "8900:8900"
    command: ["--config", "/etc/karstflow/config.toml", "--dev"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8899", "-d", '{"jsonrpc":"2.0","id":1,"method":"getHealth"}']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  validator-2:
    image: karstflow:latest
    ports:
      - "8999:8899"
      - "9000:8900"
    command: ["--config", "/etc/karstflow/config.toml", "--entrypoint", "validator-1:8001"]
    depends_on:
      validator-1:
        condition: service_healthy

  validator-3:
    image: karstflow:latest
    ports:
      - "9099:8899"
      - "9100:8900"
    command: ["--config", "/etc/karstflow/config.toml", "--entrypoint", "validator-1:8001"]
    depends_on:
      validator-1:
        condition: service_healthy
