[project]
name = "karstflow-tests"
version = "0.1.0"
description = "E2E and load testing for karstflow validator"
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "pytest-docker>=3.1",
    "pytest-benchmark>=5.1",
    "httpx>=0.28",
    "websockets>=14.0",
    "solana>=0.36",
    "solders>=0.27",
    "locust>=2.43",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karstflow_tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "smoke: Quick sanity checks (< 30s total)",
    "functional: Single-node RPC method tests",
    "websocket: WebSocket subscription tests",
    "integration: Multi-node cluster tests",
    "load: Performance and load tests",
    "slow: Tests that take > 30s",
]
timeout = 60

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
