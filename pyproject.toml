[project]
name = "karstflow-tests"
version = "0.1.0"
description = "E2E and load testing for karstflow validator"
authors = [{name = "boogvar"}]
license = {text = "Proprietary"}
requires-python = ">=3.11"
dependencies = [
    "pytest>=9.0",
    "pytest-asyncio>=0.25",
    "pytest-timeout>=2.3",
    "pytest-docker>=3.1",
    "pytest-benchmark>=5.1",
    "httpx>=0.28",
    "websockets>=14.0",
    "solana>=0.36",
    "solders>=0.27",
    "locust>=2.43",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karstflow_tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
collect_ignore_glob = ["src/*"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
markers = [
    "smoke: Quick sanity checks (< 30s total)",
    "functional: Single-node RPC method tests",
    "websocket: WebSocket subscription tests",
    "integration: Multi-node cluster tests",
    "load: Performance and load tests",
    "slow: Tests that take > 30s",
]
timeout = 60

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "PIE",   # flake8-pie
    "RUF",   # ruff-specific rules
    "PT",    # flake8-pytest-style
    "ASYNC", # flake8-async
    "S",     # flake8-bandit (security)
    "T20",   # flake8-print (no stray prints)
    "TCH",   # flake8-type-checking
    "RET",   # flake8-return
    "C4",    # flake8-comprehensions
]
ignore = [
    "S101",     # assert is fine in tests
    "S603",     # subprocess calls are intentional (node manager)
    "S607",     # partial executable paths OK for docker/curl
    "S110",     # try-except-pass OK in cleanup/teardown paths
    "TCH",      # type-checking imports add complexity for no benefit here
    "ASYNC109", # custom timeout params are intentional pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]  # security + print checks relaxed in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = false
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "solana.*",
    "solders.*",
    "locust.*",
    "pytest_docker.*",
    "pytest_benchmark.*",
]
ignore_missing_imports = true
